[project]
name = "hospital-ai"
version = "0.1.0"
description = "Agentic Bed Occupancy Planning with Temporal, LangGraph, and ML"
requires-python = ">=3.11"

dependencies = [
    "temporalio>=1.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "accelerate>=0.20.0",
    "elasticsearch>=8.0.0",
    "aiohttp>=3.9.0",
    "timesfm>=2.0.2",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
