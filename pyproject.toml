[project]
name = "hospital-ai"
version = "0.1.0"
description = "Agentic Bed Occupancy Planning with Temporal, LangGraph, and ML"
requires-python = ">=3.11"

dependencies = [
    "temporalio>=1.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "torch==2.4.1",
    "transformers==4.46.3",
    "numpy>=1.26.0,<3",
    "huggingface-hub>=0.20.0,<1",
    "accelerate>=0.25.0,<1",
    "timesfm==3.0.0",
    "scikit-learn>=1.3.0,<2",
    "watchfiles>=0.20.0",
    "elasticsearch==7.17.*",
    "aiohttp>=3.14.3",
]

[project.scripts]
temporal-worker = "app.temporal.worker:main"
temporal-client = "app.temporal.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
